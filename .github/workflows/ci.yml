name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,dev]"

      - name: Lint (ruff)
        run: ruff check claudeway/ tests/ examples/

      - name: Test (pytest)
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify wheel contents
        run: |
          python -c "
          import zipfile, glob
          w = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(w).namelist()
          assert 'claudeway/__init__.py' in names, 'missing claudeway package'
          assert 'claudeway/server.py' in names, 'missing MCP server'
          print('wheel OK:', w)
          "
