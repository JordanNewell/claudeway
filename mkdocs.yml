site_name: Claudeway
site_description: Verifiable multi-agent consensus for Claude. A coordination layer built around signed agreement.
site_url: https://jordannewell.github.io/claudeway/
repo_url: https://github.com/JordanNewell/claudeway
repo_name: JordanNewell/claudeway
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Pre-existing top-level design docs (ARCHITECTURE.md, DEPRECATION.md, etc.)
# are kept in the repo for browse-on-GitHub readers but excluded from the
# generated site — they pre-date the mkdocs setup and contain absolute
# repo-relative links that don't resolve in the site. The site pages below
# link to them via canonical GitHub URLs instead.
exclude_docs: |
  ARCHITECTURE.md
  CLAUDEWAY_TOOL.md
  DEPLOYMENT.md
  DEPRECATION.md
  NAMING.md
  PARALLEL_APPROACHES.md
  PORT_AUTHORITY.md

theme:
  name: material
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: claudeway
      primary: "#0F0F0F"
      accent: "#00FF41"
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: favicon-32.png
  logo: favicon-32.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JordanNewell/claudeway
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/claudeway/
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Jordan Newell — MIT License

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes
  - tables

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            heading_level: 2

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Concepts: concepts.md
  - Transports: transports.md
  - Adapters: adapters.md
  - MCP server: mcp-server.md
  - Benchmarks: benchmarks.md
  - Threat model: THREAT-MODEL.md
  - Changelog: CHANGELOG.md
  - API Reference:
    - claudeway: api-reference.md
